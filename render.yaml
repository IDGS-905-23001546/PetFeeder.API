services:
  - type: web
    name: petfeeder-api
    runtime: dotnet
    buildCommand: dotnet publish -c Release -o /app
    startCommand: dotnet PetFeeder.API.dll
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petfeeder-db
          property: connectionString
      - key: ASPNETCORE_URLS
        value: http://localhost:8080

databases:
  - name: petfeeder-db
    plan: free
    databaseName: petfeeder_db
